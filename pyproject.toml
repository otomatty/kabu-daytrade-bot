[project]
name = "daytrade-bot"
version = "0.1.0"
description = "kabuステーションAPI対応のデイトレード自動売買ボット(バックテスト・ペーパー・本番)とローカルダッシュボード"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "jpholiday>=0.1.10",
    # Windows には IANA タイムゾーンDBが無いため zoneinfo("Asia/Tokyo") に必要
    "tzdata>=2024.1",
]

[project.scripts]
dtbot = "daytrade_bot.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.6",
    "jsonschema>=4.22",
    "types-PyYAML",
    "playwright>=1.45",
    "types-jsonschema>=4.26.0.20261006",
]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/daytrade_bot"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "ASYNC", "S", "DTZ",
    "PL", "TRY", "PERF", "RET", "ARG", "N", "ANN", "BLE", "FBT", "T20",
]
ignore = [
    "PLR0913",  # 設定値を多く受け取るコンストラクタがある
    "PLR2004",  # テストや閾値でのマジックナンバー
    "TRY003",   # 例外メッセージは日本語で具体的に書く
    "RUF001", "RUF002", "RUF003",  # 全角文字を含む日本語の文字列とコメント
    "FBT003",
    "ARG002",   # インターフェースを実装するメソッドでは使わない引数がある
    "PLR0911",  # ガード節で早期に return するスタイルを使う
    "PLR0912",
    "N818",     # 例外名は意味が伝わる名前を優先する(OrderRejected など)
    "ANN401",   # JSON を扱う箇所では Any を使う
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101", "ANN", "PLR0915", "FBT", "ARG", "S105", "S106", "PLC0415", "S311", "PT018",
    "PLR0917", "E501", "SLF001", "PLW0108", "N802",
]
"src/daytrade_bot/devtools/**" = ["S311"]
"src/daytrade_bot/cli.py" = ["T201"]
"src/daytrade_bot/feeds/demo.py" = ["S311"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["jpholiday", "jpholiday.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
# テストでは、メソッドを呼んだ後に状態が変わったことを確かめるため、型の絞り込みの警告を無効にする
warn_unreachable = false
disable_error_code = ["comparison-overlap", "no-untyped-call"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
    "e2e: ブラウザを使う画面テスト(Chrome が必要)",
]
filterwarnings = ["error", "ignore::DeprecationWarning:websockets.*"]

[tool.coverage.run]
source = ["daytrade_bot"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
    "if __name__ == .__main__.:",
]
